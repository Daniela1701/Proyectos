<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error 500</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="pattern/cabecera :: cabecera"></div>

<div class="container d-flex justify-content-center align-items-center flex-grow-1" style="min-height: 70vh;">
    <div class="text-center">
        <h1 class="display-1 text-danger"><i class="bi bi-bug-fill"></i> 500</h1>
        <h2 class="mb-4">Error del servidor</h2>
        <p class="mb-4">Ha ocurrido un error inesperado. Intenta nuevamente más tarde.</p>
        <a th:href="@{/}" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door-fill"></i> Volver al inicio
        </a>
    </div>
</div>

<div th:replace="pattern/footer :: Footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
