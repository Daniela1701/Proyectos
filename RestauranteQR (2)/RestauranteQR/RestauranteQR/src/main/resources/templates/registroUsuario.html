<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <title>Registro - HannaFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/registroUsuario.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
</head>
<body>
<!-- Incluir cabecera y pasarle el usuario desde sesión -->
		<div th:replace="pattern/cabecera :: cabecera"></div>
		
		
	<div class="login">
		<div class="containerLogin ">
			<div class="left-section">
				<h1 class="intro intro-lg">Regístrate hoy y recibe nuestras
					promociones exclusivas</h1>
			</div>

			<div class="right-section">
				<div class="formulario">
					<div class="form-container w-100" style="max-width: 700px;">
						<h2 class="mb- text-center">
							<strong>Registro</strong>
						</h2>

						<!-- ✅ Muestra el mensaje de error si existe -->
						<p th:if="${mensajeError}" th:text="${mensajeError}"
							class="text-danger text-center fw-semibold mb-3"></p>

						<form th:action="@{/usuario/registroUsuario}" method="post">
							<label for="nombre">Nombre:</label> 
							<input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingrese su nombre" required> 
							<label for="apellido">Apellidos:</label> 
							<input type="text" id="apellido" name="apellido" class="form-control" placeholder="Ingrese su apellido completo" required> 
							<label for="correo">Correo electrónico:</label>
							<input type="email" id="correo" name="correo" class="form-control" placeholder="Ingrese su correo" required> 
							<label for="username">Usuario:</label> <input type="text" id="username" name="username" class="form-control" placeholder="Cree su usuario" required>

							<div class="mb-3">
								<label for="password" class="form-label">Contraseña:</label>
								<div class="input-group">
									<input type="password" id="password" name="password" class="form-control" placeholder="Cree su contraseña" required>
									<button type="button" onclick="togglePassword()" class="btn-eye-toggle">
										<img src="https://cdn-icons-png.flaticon.com/512/709/709612.png" alt="Mostrar" style="width: 20px; height: 20px;">
									</button>
								</div>
							</div>

							<button type="submit" class="btn btn-orange w-100 mt-1">Registrarse</button>

							<!-- Enlace a login -->
							<p class="text-center mt-3">
								¿Ya tienes una cuenta? <a th:href="@{/usuario/login}">Inicia
									sesión</a>
							</p>
						</form>
					</div>
				</div>
			</div>
		</div>

		<div class="intro intro-sm text-center">Regístrate hoy y recibe
			nuestras promociones exclusivas</div>
	</div>
<div th:replace="/pattern/footer:: Footer"></div>
<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS para mostrar/ocultar contraseña -->
<script>
    function togglePassword() {
      const password = document.getElementById("password");
      password.type = password.type === "password" ? "text" : "password";
    }
 </script>
</body>
</html>
