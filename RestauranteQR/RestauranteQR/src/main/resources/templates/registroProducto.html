<!-- registroProducto.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<title>Registrar Producto</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
	<link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
	    <link rel="stylesheet" th:href="@{/css/menu.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

	<div th:replace="pattern/cabecera :: cabecera"></div>
		

	<!-- FORMULARIO DE REGISTRO DE PRODUCTO -->
	<div class="container mt-5 mb-5 flex-grow-1" style="max-width: 720px;font-size:20px">
		<!-- MENSAJES -->
		<div th:if="${mensajeError}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill"></i> <span
				th:text="${mensajeError}">Error de validación</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Cerrar"></button>
		</div>

		<div th:if="${mensajeExito}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill"></i> <span
				th:text="${mensajeExito}">Registro exitoso</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Cerrar"></button>
		</div>

		<!-- TARJETA -->
		<div class="card shadow-lg border-0">
			<div class="card-header text-white"
				style="background-color:#F66301;font-size:24px">
				<p class="mb-0">📦 Registro de Producto</p>
			</div>
			<div class="card-body">
				<form th:action="@{/producto/registroProducto}" method="post">
					<!-- NOMBRE -->
					<div class="mb-3">
						<label for="nombre" class="form-label" style="font-weight: 600;">Nombre del producto:</label>
						<input type="text" name="nombre" required class="form-control"  style="font-size:20px"
							id="nombre" placeholder="Ej. Pizza Hawaiana" />
					</div>

					<!-- CATEGORÍA -->
					<div class="mb-3">
						<label for="categoría" class="form-label" style="font-weight: 600;">Categoría:</label> <select style="font-size:20px"
							name="categoria" required class="form-select" id="categoría">
							<option value="" disabled selected>Selecciona una
								categoría</option>
							<option value="Comida">Comida</option>
							<option value="Bebida">Bebida</option>
							<option value="Postre">Postre</option>
						</select>
					</div>

					<!-- PRECIO Y STOCK -->
					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="precio" class="form-label" style="font-weight: 600;">Precio (S/):</label> <input style="font-size:20px"
								type="number" name="precio" min="0" step="0.01" required
								class="form-control" id="precio" placeholder="Ej. 25.00" />
						</div>
						<div class="col-md-6 mb-3">
							<label for="stock" class="form-label" style="font-weight: 600;">Stock:</label> <input style="font-size:20px"
								type="number" name="stock" min="0" required class="form-control"
								id="stock" placeholder="Ej. 10" />
						</div>
					</div>

					<!-- IMAGEN -->
					<div class="mb-3">
						<label for="imagen" class="form-label" style="font-weight: 600;">URL de la imagen:</label> <input style="font-size:20px"
							type="text" name="url" class="form-control" id="imagen"
							placeholder="https://..." />
					</div>

					<!-- ESTADO -->
					<div class="mb-4">
						<label for="estado" class="form-label" style="font-weight: 600;">Estado:</label> <select style="font-size:20px"
							name="estado" class="form-select" id="estado" required>
							<option value="" disabled selected>Seleccione el estado</option>
							<option value="true">Activo</option>
							<option value="false">Inactivo</option>
						</select>
					</div>

					<!-- BOTONES -->
					<div class="text-center">
						<button type="submit" class="btn me-2" style="--bs-btn-bg: #F66301;--bs-btn-hover-bg: #fe9f2b;--bs-btn-hover-color: white;--bs-btn-color:white; font-size:20px ">
							<i class="bi bi-box-arrow-in-down"></i> Registrar Producto
						</button>
						<a th:href="@{/producto/gestionarProductos}" style="--bs-btn-hover-bg: #F66301;font-size:20px"
							class="btn btn-outline-secondary"> <i
							class="bi bi-arrow-left-circle"></i> Volver a la Lista
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

    <div th:replace="/pattern/footer:: Footer"></div>
    
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
