<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Descuentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/gestion.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
	<div th:replace="pattern/cabecera :: cabecera"></div>
	    
	    <div class="container mt-4 flex-grow-1 gestion-container">
			<div class="card border">
				<div class="card-header d-flex justify-content-between align-items-center card-color">
					<div>
						<p class="lista-font-2 mb-2 mt-2">Lista de Descuentos</p>
						<p class="text-muted gestion-font">Gestión de descuentos en
							Productos</p>
					</div>
				</div>
	
				<div class="card-body p-0">
					<div class="table-responsive">
						<table class="table mb-0">
							<thead class="table-orange text-center">
								<tr class="tr-size">
									<th class="w-5 th-nowrap">ID</th>
								    <th class="w-15 th-nowrap">Producto</th>
								    <th class="w-15 th-nowrap">Precio Original</th>
								    <th class="w-10 th-nowrap">Descuento</th>
								    <th class="w-15 th-nowrap">Precio Final</th>
								    <th class="w-10 th-nowrap">Fecha Inicio</th>
								    <th class="w-10 th-nowrap">Fecha Fin</th>
								    <th class="w-10 th-nowrap">Estado</th>
								    <th class="w-10 th-nowrap">Acción</th>
								</tr>
							</thead>
							<tbody class="text-center">
								<tr class="tr-size" th:each="descuento : ${listarDescuentos}">
									<td th:text="${descuento.idDescuento}"></td>
						            <td th:text="${descuento.producto.nombre}"></td>
						            <td th:text="${T(java.lang.String).format('%.2f', descuento.producto.precio)}"></td>
									<td th:text="${T(java.lang.String).format('%.2f', descuento.valorDescuento)}"></td>
									<td th:text="${T(java.lang.String).format('%.2f', descuento.producto.precio - descuento.valorDescuento)}"></td>
						            <td th:text="${#temporals.format(descuento.fechaInicio, 'dd/MM/yyyy')}"></td>
									<td th:text="${#temporals.format(descuento.fechaFin, 'dd/MM/yyyy')}"></td>
						            <td th:text="${descuento.estado ? 'Activo' : 'Inactivo'}"></td>
									<td class="center">
									<a
										th:href="@{'/descuento/editarDescuento/' + ${descuento.idDescuento}}"
										class="btn btn-sm me-1 btn-color-2"> <i
											class="fa-solid fa-pen-to-square"></i>
									</a> 
									
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
	
			<div class="text-center mt-4">
				<a th:href="@{/aplicacion/home}" class="btn btn-outline-secondary" style=" --bs-btn-hover-bg: #F66301; font-size: 20px">
					<i class="bi bi-arrow-left-circle"></i> Volver al inicio
				</a>
			</div>
		</div>
	
		<div th:replace="/pattern/footer:: Footer"></div>
		
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
