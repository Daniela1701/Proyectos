<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/gestion.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <div th:replace="pattern/cabecera :: cabecera"></div>
  
  <div class="container mt-4 flex-grow-1 gestion-container">
		<div class="card border">
			<div
				class="card-header d-flex justify-content-between align-items-center card-color">
				<div>
					<h5 class="lista-font-2 mb-2 mt-2">Lista de Usuarios</h5>
					<p class="text-muted gestion-font">Gestión de Usuarios /
						Colaboradores</p>
				</div>
				<a th:href="@{/usuario/registroUsuario}" class="btn btn-color lista-font">+ Nuevo Usuario</a>
			</div>

			<div class="card-body p-0">
				<div class="table-responsive">
					<table class="table mb-0">
						<thead class="table-orange text-center">
							<tr class="tr-size">
								<th>ID</th>
								<th>Usuario</th>
								<th>Estado</th>
								<th>Categoría</th>
								<th>Perfil</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody class="text-center">
							<tr class="tr-size" th:each="usuario : ${listaUsuarios}">
								<td th:text="${usuario.idUsuario}"></td>
								<td th:text="${usuario.username}"></td>
								<td th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></td>
								<td th:text="${usuario.categoria.nombre}"></td>
								<td
									th:text="${usuario.perfil != null ? usuario.perfil.nombre : 'Sin perfil'}"></td>
								<td class="center"><a
									th:href="@{'/usuario/editarUsuario/' + ${usuario.idUsuario}}"
									class="btn btn-sm me-1 btn-color-2"> <i
										class="fa-solid fa-pen-to-square"></i>
								</a></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="text-center mt-4">
			<a th:href="@{/aplicacion/home}" class="btn btn-outline-secondary" style=" --bs-btn-hover-bg: #F66301; font-size: 20px">
				<i class="bi bi-arrow-left-circle"></i> Volver al inicio
			</a>
		</div>
	</div>
	
	<div th:replace="/pattern/footer:: Footer"></div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
