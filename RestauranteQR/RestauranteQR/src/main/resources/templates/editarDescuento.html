<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Descuento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">    
</head>
<body class="d-flex flex-column min-vh-100">

	<div th:replace="pattern/cabecera :: cabecera"></div>

	<!-- FORMULARIO DE EDICIÓN DE DESCUENTO -->
	<div class="container mt-5 mb-5 flex-grow-1"
		style="max-width: 720px; font-size: 20px">
		<!-- MENSAJES -->
		<div th:if="${mensajeError}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="bi bi-exclamation-triangle-fill"></i> <span
				th:text="${mensajeError}">Error al editar</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Cerrar"></button>
		</div>
		<div th:if="${mensajeExito}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="bi bi-check-circle-fill"></i> <span
				th:text="${mensajeExito}">Cambios guardados</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Cerrar"></button>
		</div>

		<!-- TARJETA -->
		<div class="card shadow-lg border-0">
			<div class="card-header text-white"
				style="background-color: #F66301; font-size: 24px">
				<p class="mb-0">✏️ Editar Descuento</p>
			</div>
			<div class="card-body">
				<form th:action="@{/descuento/editarDescuento}" method="post">
					<!-- ID oculto -->
					<input type="hidden" name="idDescuento"
						th:value="${descuento.idDescuento}" />

					<!-- ID PRODUCTO -->
					<div class="mb-3">
						<label for="idProducto" class="form-label" style="font-weight: 600;">ID Producto:</label> <input
							type="text" name="idProducto" required class="form-control"
							style="font-size: 20px" id="idProducto"
							th:value="${descuento.producto.idProducto}" />
					</div>

					<!-- DESCUENTO -->
					<div class="mb-3">
						<label for="valorDescuento" class="form-label" style="font-weight: 600;">Valor del
							Descuento:</label> <input type="text" name="valorDescuento" required
							class="form-control" style="font-size: 20px" id="valorDescuento"
							th:value="${descuento.valorDescuento}" />
					</div>

					<!-- FECHA INICIAL Y FINAL -->
					<div class="row">
						<div class="col-md-6 mb-3">
							<label for="fechaInicio" class="form-label" style="font-weight: 600;">Fecha Inicio:</label>
							<input style="font-size: 20px" type="datetime-local" name="fechaInicio"
								required class="form-control" id="fechaInicio"
							    th:value="${#temporals.format(descuento.fechaInicio, 'yyyy-MM-dd''T''HH:mm')}" />
						</div>
						<div class="col-md-6 mb-3">
							<label for="fechaFinal" class="form-label" style="font-weight: 600;">Fecha Final:</label> <input
								style="font-size: 20px" type="datetime-local" name="fechaFinal" required
								class="form-control" id="fechaFinal"
								th:value="${#temporals.format(descuento.fechaFin, 'yyyy-MM-dd''T''HH:mm')}" />
						</div>
					</div>

					<!-- ESTADO -->
					<div class="mb-4">
						<label for="estado" class="form-label" style="font-weight: 600;">Estado</label> <select
							style="font-size: 20px" name="estado" class="form-select"
							id="estado" required>
							<option th:value="true" th:selected="${descuento.estado} == true">Activo</option>
							<option th:value="false"
								th:selected="${descuento.estado} == false">Inactivo</option>
						</select>
					</div>

					<!-- BOTONES -->
					<div class="text-center">
						<button type="submit" class="btn me-2"
							style="--bs-btn-bg: #F66301; --bs-btn-hover-bg: #fe9f2b; --bs-btn-hover-color: white; --bs-btn-color: white; font-size: 20px">
							<i class="bi bi-pencil-square"></i> Guardar Cambios
						</button>
						<a th:href="@{/descuento/gestionarDescuentos}"
							style="--bs-btn-hover-bg: #F66301; font-size: 20px"
							class="btn btn-outline-secondary"> <i
							class="bi bi-arrow-left-circle"></i> Volver a la Lista
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

	<div th:replace="/pattern/footer:: Footer"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
