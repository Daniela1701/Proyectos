<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Carrito de Compras</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
	rel="stylesheet" />
<link rel="stylesheet" th:href="@{/css/carrito.css}" />
<link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body class="bg-light">
	<div th:replace="pattern/cabecera :: cabecera"></div>

	<div class="container py-5">
		<div class="mb-4"
			style="background-color: #F66301; font-size: 30px; color: white">
			<p class="fw-bold text-center">🛒 Carrito de compra</p>
			<p class="text-center">Resumen de tus productos
				seleccionados</p>
		</div>

		<div th:if="${mensajeError}" th:text="${mensajeError}"
			class="alert alert-danger fw-semibold"></div>
		<div th:if="${mensajeExito}" th:text="${mensajeExito}"
			class="alert alert-success fw-semibold"></div>

		<div th:if="${carrito}">
			<form method="post" th:action="@{/carrito/aplicarVenta}"
				id="formVenta">
				<div class="row">
					<!-- Columna izquierda -->
					<div class="col-md-8">
						<div class="mb-4">
							<label for="idSede" class="form-label fw-semibold">Seleccionar
								una sede:</label> <select id="idSede" name="idSede" class="form-select">
								<option value="" disabled selected id="opcionDefault">--
									Selecciona una sede --</option>
								<option th:each="s : ${sede}" th:value="${s.idSede}"
									th:text="${s.nombre}"></option>
							</select>
						</div>

						<div id="seccionBoleta" style="display: none;">
							<div th:each="item, iStat : ${carrito}" class="card mb-3">
								<div
									class="card-body d-flex align-items-center justify-content-between">
									<div class="flex-grow-1">
										<p class="mb-1 fw-bold" th:text="${item.nombreProducto}"></p>
										<p class="mb-1">
											Precio: <strong th:text="'S/. ' + ${item.precio}"></strong> <span
												th:if="${item.precioOriginal != item.precio}"
												class="text-muted text-decoration-line-through ms-2"
												th:text="'S/. ' + ${item.precioOriginal}"></span>
										</p>
										<label>Cantidad:</label> <input type="number"
											name="cantidades" min="1" th:max="${item.stock}"
											th:value="${item.cantidad}"
											class="form-control form-control-sm w-25 d-inline cantidad"
											th:attr="data-index=${iStat.index}, data-precio=${item.precio}"
											onchange="actualizarSubtotal(this)" required /> <input
											type="hidden" name="idProductos"
											th:value="${item.idProducto}" />
									</div>

									<!-- Botón de eliminar funcional -->
									<button type="button" class="btn btn-danger btn-sm ms-3"
										th:onclick="'eliminarItem(' + ${item.idProducto} + ')'">Eliminar</button>
								</div>
							</div>
						</div>
					</div>

					<!-- Columna derecha -->
					<div class="col-md-4">
						<div class="border rounded p-4 bg-white shadow-sm"
							id="seccionResumen" style="display: none;">
							<h5 class="fw-bold mb-3">Detalle de pedido</h5>

							<div id="resumen-items">
								<div th:each="item, iStat : ${carrito}"
									class="d-flex justify-content-between resumen-item"
									th:attr="data-index=${iStat.index}">
									<span class="resumen-nombre"
										th:text="${item.cantidad} + ' ' + ${item.nombreProducto}"></span>
									<span class="resumen-precio"
										th:text="'S/. ' + ${#numbers.formatDecimal(item.precio * item.cantidad, 1, 'POINT', 2, 'POINT')}"></span>
								</div>
							</div>

							<hr>
							<p>
								Subtotal <span class="float-end" id="subtotalGeneral">S/.
									0.00</span>
							</p>
							<p>
								IGV (18%) <span class="float-end" id="igv">S/. 0.00</span>
							</p>
							<p class="fw-bold fs-5">
								Total <span class="float-end text-success" id="totalCarrito">S/.
									0.00</span>
							</p>

							<div class="d-flex flex-column flex-md-row justify-content-md-between mt-4 gap-2">
							    <a th:href="@{/aplicacion/home}" class="btn btn-secondary w-100 w-md-auto"
							       style="--bs-btn-hover-bg: #F66301; border: none;">
							        <i class="bi bi-arrow-left-circle"></i> Seguir comprando
							    </a>
							
							    <button type="submit" class="boton-naranja w-100 w-md-auto" id="btnAplicarVenta">
							        Aplicar Venta
							    </button>
							</div>

						</div>
					</div>
				</div>
			</form>
		</div>

		<div th:unless="${carrito}" class="text-center mt-4">
			<div class="alert alert-warning text-center" role="alert">
				<i class="bi bi-info-circle"></i> Tu carrito está vacío. ¡Agrega
				algún producto!
			</div>
			<br /> <a th:href="@{/aplicacion/home}" class="btn btn-secondary"
				style="--bs-btn-hover-bg: #F66301; border: none;"> <i
				class="bi bi-arrow-left-circle"></i> Explorar productos
			</a>
		</div>
	</div>
   <!-- Footer -->
    <div th:replace="/pattern/footer :: Footer"></div>
	<!-- Script funcional para eliminar productos -->
	<script>
function eliminarItem(idProducto) {
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "/carrito/eliminarItem";

    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "idProducto";
    input.value = idProducto;

    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
}
</script>

	<!-- Scripts adicionales -->
	<script>
function actualizarTotales() {
    let subtotalGeneral = 0;
    document.querySelectorAll('.cantidad').forEach(input => {
        const index = input.getAttribute('data-index');
        const precio = parseFloat(input.getAttribute('data-precio'));
        const cantidad = parseInt(input.value);
        const subtotal = precio * cantidad;
        subtotalGeneral += subtotal;

        const resumenItem = document.querySelector('.resumen-item[data-index="' + index + '"]');
        if (resumenItem) {
            resumenItem.querySelector('.resumen-nombre').innerText = cantidad + ' ' + resumenItem.querySelector('.resumen-nombre').innerText.split(' ').slice(1).join(' ');
            resumenItem.querySelector('.resumen-precio').innerText = 'S/. ' + (precio * cantidad).toFixed(2);
        }
    });
    const igv = subtotalGeneral * 0.18;
    const total = subtotalGeneral + igv;
    document.getElementById('subtotalGeneral').innerText = 'S/. ' + subtotalGeneral.toFixed(2);
    document.getElementById('igv').innerText = 'S/. ' + igv.toFixed(2);
    document.getElementById('totalCarrito').innerText = 'S/. ' + total.toFixed(2);
}

function actualizarSubtotal(input) {
    actualizarTotales();
}

document.getElementById("idSede").addEventListener("change", function () {
    const valor = this.value;
    const seccionBoleta = document.getElementById("seccionBoleta");
    const seccionResumen = document.getElementById("seccionResumen");
    const opcionDefault = document.getElementById("opcionDefault");

    if (valor) {
        seccionBoleta.style.display = "block";
        seccionResumen.style.display = "block";
        if (opcionDefault) opcionDefault.disabled = true;
        actualizarTotales();
    } else {
        seccionBoleta.style.display = "none";
        seccionResumen.style.display = "none";
    }
});

document.getElementById("btnAplicarVenta").addEventListener("click", function (e) {
    const sede = document.getElementById("idSede").value;
    if (!sede) {
        e.preventDefault();
        alert("Debe seleccionar una sede antes de aplicar la venta.");
    }
});

window.onload = actualizarTotales;
</script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
