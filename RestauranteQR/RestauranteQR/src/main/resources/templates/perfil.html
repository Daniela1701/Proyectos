<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="pattern/cabecera :: cabecera"></div>

<div class="container mt-5 mb-5 flex-grow-1" style="max-width: 720px;font-size:20px">
    <!-- MENSAJES -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${mensajeError}">Error al actualizar</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${mensajeExito}">Perfil actualizado</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- TARJETA PERFIL -->
    <div class="card shadow-lg border-0">
        <div class="card-header text-white" style="background-color: #F66301;font-size:24px">
            <p class="mb-0">👤 Editar Perfil</p>
        </div>
        <div class="card-body">
            <form th:action="@{/perfil/actualizar}" method="post">
                <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}" />

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label" style="font-weight: 600;">Nombre:</label>
                    <input type="text" name="nombre" class="form-control" id="nombre" required
                           th:value="${perfil.nombre}" style="font-size:20px" />
                </div>

                <!-- APELLIDO -->
                <div class="mb-3">
                    <label for="apellido" class="form-label" style="font-weight: 600;">Apellido:</label>
                    <input type="text" name="apellido" class="form-control" id="apellido" required
                           th:value="${perfil.apellido}" style="font-size:20px" />
                </div>

                <!-- CORREO -->
                <div class="mb-3">
                    <label for="correo" class="form-label" style="font-weight: 600;">Correo Electrónico:</label>
                    <input type="email" name="correo" class="form-control" id="correo" required
                           th:value="${perfil.correo}" style="font-size:20px" />
                </div>

                <!-- BOTONES -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn me-2" style="--bs-btn-bg: #F66301; --bs-btn-hover-bg: #fe9f2b; --bs-btn-hover-color: white; --bs-btn-color:white; font-size:20px">
                        <i class="bi bi-save2-fill"></i> Guardar Cambios
                    </button>
                    <a th:href="@{/aplicacion/home}" class="btn btn-outline-secondary" style="font-size:20px">
                        <i class="bi bi-arrow-left-circle"></i> Volver
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="/pattern/footer :: Footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
