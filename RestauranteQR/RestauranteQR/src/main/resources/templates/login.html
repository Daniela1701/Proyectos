<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/registroUsuario.css}">
	<link rel="stylesheet" th:href="@{/css/menu.css}">
	<link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
</head>
<body>
<div th:replace="pattern/cabecera :: cabecera"></div>
	<div class="login">
		<div class="containerLogin ">
			<div class="left-section">
				<h1 class="intro intro-lg">Bienvenido, inicia sesión</h1>
			</div>

			<div class="right-section">
				<div class="formulario">
					<div class="form-container w-100" style="max-width: 700px;">
						<h2 class="text-center mb-3">
							<strong>Iniciar Sesión</strong>
						</h2>

						<!-- Mensaje de error -->
						<p th:if="${mensajeError}" th:text="${mensajeError}"
							class="text-danger text-center fw-semibold mb-3"></p>

						<form th:action="@{/usuario/login}" method="post">
							<label for="username">Usuario:</label>
							 <input type="text" id="username" name="username" class="form-control"
								placeholder="Ingrese su usuario" required>

							<div class="mb-3">
								<label for="password" class="form-label">Contraseña:</label>
								<div class="input-group">
									<input type="password" id="password" name="password"
										class="form-control" placeholder="Ingrese su contraseña"
										required>
									<button type="button" onclick="togglePassword()"
										class="btn-eye-toggle">
										<img
											src="https://cdn-icons-png.flaticon.com/512/709/709612.png"
											alt="Mostrar" style="width: 20px; height: 20px;">
									</button>
								</div>
							</div>

							<button type="submit" class="btn btn-orange w-100 mt-3">Iniciar
								Sesión</button>

							<p class="text-center mt-3">
								¿No tienes una cuenta? <a th:href="@{/usuario/registroUsuario}">Regístrate</a>
							</p>
						</form>
					</div>
				</div>
			</div>
		</div>

		<div class="intro intro-sm text-center">Bienvenido, inicia
			sesión</div>
	</div>
<div th:replace="/pattern/footer:: Footer"></div>
	<script>
		function togglePassword() {
			const password = document.getElementById("password");
			password.type = password.type === "password" ? "text" : "password";
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	
</body>
</html>
