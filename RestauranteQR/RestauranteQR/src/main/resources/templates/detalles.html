<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de mi pedido</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/misDetalles.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Cabecera -->
    <div th:replace="pattern/cabecera :: cabecera"></div>

    <!-- Contenido principal -->
    <div class="container container-pedido flex-grow-1 my-4" style="font-size: 18px;">
        <div class="card card-pedido">
            <!-- Cabecera naranja -->
            <div class="row header align-items-center">
                <div class="col-md-6">
                    <p class="fw-bold text-white fs-4 mb-1">Detalle de Pedido</p>
                     <p class="text-white mb-0">
					    <strong>Usuario:</strong>
					    <span th:text="${pedido.usuario.username}">NombreUsuario</span>
					</p>
                   
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0 fecha text-white">
                    <p class="mb-0">
                        <strong>Fecha:</strong>
                        <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">00/00/2000</span>
                    </p>
                    <p class="text-white mb-0">
					    <strong>Total:</strong>
					    <span th:text="'S/. ' + ${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'POINT')}">S/. 0.00</span>
					</p>
                </div>
            </div>

            <!-- Tabla de detalles -->
            <div class="table-responsive">
                <table class="table text-center mb-0 custom-table-border">
                    <thead class="custom-header">
                        <tr>
                            <th>ID Detalle</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${detalles}">
                            <td th:text="${detalle.idDetalle}">Id 1</td>
                            <td th:text="${detalle.producto.nombre}">Producto</td>
                            <td th:text="${detalle.cantidad}">1</td>
                            <td th:text="'S/. ' + ${detalle.precioUnitario}">S/. 0.00</td>
                            <td th:text="'S/. ' + ${detalle.subtotal}">S/. 0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Botón de volver -->
        <div class="mt-4 text-center">
            <a th:href="@{/pedido/listarPedidos}" class="btn btn-naranja">
                <i class="bi bi-arrow-left-circle"></i> Volver a lista de pedidos
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="/pattern/footer :: Footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
