<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title th:text="'Mis pedidos de ' + ${usuario.username}">Mis Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/gestion.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
  <link rel="stylesheet" th:href="@{/css/menu.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <div th:replace="pattern/cabecera :: cabecera"></div>

  <div class="container mt-4 flex-grow-1 gestion-container">
  <div class="card border">

    <!-- Cabecera del card -->
	<div class="card-header d-flex justify-content-between align-items-center card-color">
	  <div>
	    <p class="lista-font-2 mb-2 mt-2" th:text="'Mis pedidos '">Mis pedidos</p>
	    <p class="text-muted gestion-font">Lista de Pedidos realizados</p>
	  </div>
	</div>


    <!-- Cuerpo del card -->
    <div class="card-body p-0">

      <!-- MENSAJE SI NO HAY PEDIDOS -->
      <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-warning text-center m-3" role="alert">
        <i class="bi bi-info-circle"></i> Aún no tienes pedidos registrados.
      </div>

      <!-- TABLA DE PEDIDOS -->
      <div th:unless="${#lists.isEmpty(pedidos)}" class="table-responsive">
        <table class="table align-middle mb-0 text-center">
          <thead class="table-orange">
            <tr class="tr-size">
              <th>ID Pedido</th>
              <th>Fecha</th>
              <th>Subtotal</th>
              <th>IGV</th>
              <th>Total</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="pedido : ${pedidos}" class="tr-size">
              <td th:text="${pedido.idPedido}"></td>
              <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></td>
              <td>S/ <span th:text="${#numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'POINT')}"></span></td>
				<td>S/ <span th:text="${#numbers.formatDecimal(pedido.igv, 1, 'POINT', 2, 'POINT')}"></span></td>
				<td class="fw-bold text-success">S/ <span th:text="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'POINT')}"></span></td>
				<td><!-- Botón Detalles --> <a
					th:href="@{'/pedido/misDetalles/' + ${pedido.idPedido}}"
					class="btn btn-outline-secondary me-2"
					style="--bs-btn-hover-bg: #F66301" title="Ver Detalle"> <i
					class="bi bi-file-earmark-text" style="font-size: 15px;"></i> <i
					class="bi bi-search" style="font-size: 15px;"></i>
					</a> <!-- Botón Descargar PDF --> <a
					th:href="@{'/pedido/boleta/' + ${pedido.idPedido}}"
					class="btn btn-outline-success"
					style="--bs-btn-hover-bg: #198754" title="Descargar Boleta"
					target="_blank"> <i class="bi bi-download"
					style="font-size: 15px;"></i> <i class="bi bi-file-earmark-pdf"
					style="font-size: 15px;"></i>
					</a>
				</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- BOTÓN VOLVER -->
  <div class="text-center mt-4">
    <a th:href="@{/aplicacion/home}" class="btn btn-outline-secondary" style="--bs-btn-hover-bg: #F66301;">
      <i class="bi bi-arrow-left-circle"></i> Volver al inicio
    </a>
  </div>
</div>

  
  <div th:replace="/pattern/footer:: Footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
