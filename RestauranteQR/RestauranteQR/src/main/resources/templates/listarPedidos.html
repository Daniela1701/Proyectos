<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/gestion.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}" type="text/css">
  <link rel="stylesheet" th:href="@{/css/menu.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div th:replace="pattern/cabecera :: cabecera"></div>

  <div class="container mt-4 flex-grow-1 gestion-container">
    <div class="card border">
      <div class="card-header d-flex justify-content-between align-items-center card-color">
        <div>
          <p class="lista-font-2 mb-2 mt-2">Lista de Pedidos</p>
          <p class="text-muted gestion-font">Historial de pedidos realizados</p>
        </div>
        <!-- Opcional: botón nuevo si fuera útil -->
        <!-- <a href="#" class="btn btn-color lista-font">+ Nuevo Pedido</a> -->
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table mb-0">
            <thead class="table-orange text-center">
              <tr class="tr-size">
                <th>ID Pedido</th>
                <th>Fecha</th>
                <th>Subtotal</th>
                <th>IGV</th>
                <th>Total</th>
                <th>Sede</th>
                <th>Usuario</th>
                <th>Detalles</th>
                <th>Boleta</th>
              </tr>
            </thead>
            <tbody class="text-center">
              <tr class="tr-size" th:each="pedido : ${pedidos}">
                <td th:text="${pedido.idPedido}">ID</td>
                <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                <td th:text="${#numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'POINT')}">S/ 0.00</td>
				<td th:text="${#numbers.formatDecimal(pedido.igv, 1, 'POINT', 2, 'POINT')}">S/ 0.00</td>
				<td th:text="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'POINT')}">S/ 0.00</td>
                <td th:text="${pedido.sede.nombre}">Sede</td>
                <td th:text="${pedido.usuario.username}">Usuario</td>
                <td>
                  <a th:href="@{'/pedido/detalles/' + ${pedido.idPedido}}" class="btn btn-outline-secondary" style="--bs-btn-hover-bg: #F66301;">
					  <i class="bi bi-file-earmark-text" style="font-size: 15px;"></i>
					  <i class="bi bi-search" style="font-size: 15px;"></i>
					</a>
                </td>
                <td><a th:href="@{'/pedido/boleta/' + ${pedido.idPedido}}"
				class="btn btn-outline-success"
					style="--bs-btn-hover-bg: #198754" title="Descargar Boleta"> <i class="bi bi-download"
					style="font-size: 15px;"></i> <i class="bi bi-file-earmark-pdf"
					style="font-size: 15px;"></i>
				</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <a th:href="@{/aplicacion/home}" class="btn btn-outline-secondary" style="--bs-btn-hover-bg: #F66301; font-size: 20px">
        <i class="bi bi-arrow-left-circle"></i> Volver al inicio
      </a>
    </div>
  </div>

  <div th:replace="/pattern/footer:: Footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
